## Lets the lakecompute engine read the project's Databricks upstreams: the
## backend attaches the Unity Catalog named in `catalog_database` using the
## profile's databricks credential (required since stg_report lives there).
## Read-only as a model target; credentials come from the profile connection.

catalogs:
  - name: quack_demo_cat
    type: unity
    table_format: iceberg
    config:
      lakecompute:
        catalog_database: "{{ env_var('DATABRICKS_CATALOG') }}"
        region: "{{ env_var('DATABRICKS_DEFAULT_REGION') }}"
        host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
