config-version: 2
name: 'aws_cloud_cost'
version: '0.3.2'
require-dbt-version: [">=1.3.0", "<3.0.0"]
profile: aws_cloud_cost

models:
  aws_cloud_cost:
    ## Must match the single uncommented catalog in catalogs.yml.
    ## Valid names: ducklake | lakekeeper | horizon | mdls | unity | s3_tables
    ## Commented out for the dbt_compute (Alt engine) test run — build_relation_catalog
    ## can't be invoked by the Alt adapter.
    # +catalog_name: mdls
    +schema: aws_cloud_cost
    +materialized: table

    staging:
      +materialized: table

seeds:
  aws_cloud_cost:
    ## Seeds go into a plain (non-Iceberg) database — the catalog-linked
    ## database (snowflake_demo's default) rejects multi-statement
    ## transactions on unmanaged Iceberg tables, which seed loads use.
    +database: "{{ env_var('SNOWFLAKE_SEED_DATABASE', 'SEEDS') }}"
    +schema: aws_cloud_cost

vars:
  aws_cloud_cost_start_date: "1970-01-01"

flags:
  use_catalogs_v2: true
  require_generic_test_arguments_property: true
  send_anonymous_usage_stats: false
