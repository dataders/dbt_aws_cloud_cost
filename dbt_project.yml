config-version: 2
name: 'aws_cloud_cost'
version: '0.3.2'
require-dbt-version: [">=1.3.0", "<3.0.0"]
profile: aws_cloud_cost

models:
  aws_cloud_cost:
    ## No +catalog_name on this branch: the whole project's default target IS
    ## the Alt engine (see profiles.yml), and +catalog_name is known-broken
    ## there (build_relation_catalog has no dispatch arm for AdapterType::Alt
    ## -- see docs/superpowers/specs/2026-08-04-mdls-dbt-compute-scenarios-design.md).
    ## Models write straight into the dbt_compute output's own database/schema.
    +schema: aws_cloud_cost
    +materialized: table

    staging:
      +materialized: table

seeds:
  aws_cloud_cost:
    +schema: aws_cloud_cost

vars:
  aws_cloud_cost_start_date: "1970-01-01"

flags:
  use_catalogs_v2: true
  require_generic_test_arguments_property: true
  send_anonymous_usage_stats: false
