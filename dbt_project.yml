config-version: 2
name: 'aws_cloud_cost'
version: '0.3.2'
require-dbt-version: [">=1.3.0", "<3.0.0"]
profile: aws_cloud_cost

models:
  aws_cloud_cost:
    ## Must match the single uncommented catalog in catalogs.yml.
    ## Valid names: ducklake | lakekeeper | horizon | polaris | unity | s3_tables
    +catalog_name: ducklake
    +schema: aws_cloud_cost
    +materialized: table

    staging:
      +materialized: table

seeds:
  aws_cloud_cost:
    +schema: aws_cloud_cost

vars:
  aws_cloud_cost_start_date: "1970-01-01"

flags:
  use_catalogs_v2: true
  require_generic_test_arguments_property: true
  send_anonymous_usage_stats: false
