## Profile for the multi-catalog demo (DuckDB only).
##
## Secret blocks follow the same convention as catalogs.yml: the secrets for
## inactive catalogs are commented with `# ` and must be uncommented together
## with their catalog block. minio_secret stays active — it is static, makes
## no network call at creation, and is required by the lakekeeper target.
aws_cloud_cost:
  target: snowflake_demo
  x_alt_target: lake_compute
  outputs:
    ## Lake Compute (Alt engine) — queries the opening_pulling MDLS destination
    ## via the staging Lake Compute service. Needs LAKE_COMPUTE_AUTH_TOKEN (a
    ## minted JWT) + LAKE_COMPUTE_ORG from the env; see polaris.envrc /
    ## dbt-aws-cloud-cost.envrc in the private overlay.
    lake_compute:
      type: alt
      method: token
      base_url: "{{ env_var('LAKE_COMPUTE_BASE_URL') }}"
      token: "{{ env_var('LAKE_COMPUTE_AUTH_TOKEN') }}"
      organization: "{{ env_var('LAKE_COMPUTE_ORG') }}"
      database: "{{ env_var('LAKE_COMPUTE_DATABASE') }}"
      schema: "{{ env_var('LAKE_COMPUTE_SCHEMA') }}"
      threads: 4
    ## snowflake_demo — native Snowflake output against the catalog-linked
    ## database created from the Snowflake catalog integration pointed at the
    ## opening_pulling MDLS destination. Key-pair auth (password 403s here);
    ## creds come from the "MDLS Compute (Snowflake)" 1Password item. See
    ## .env.example for the SNOWFLAKE_* vars.
    snowflake_demo:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      threads: 4
