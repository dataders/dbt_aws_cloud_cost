## Profile for the multi-catalog demo (DuckDB only).

aws_cloud_cost:
  target: prod
  outputs:

    prod:
      - type: snowflake
        default: true
        account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
        user: "{{ env_var('SNOWFLAKE_USER') }}"
        private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
        role: "{{ env_var('SNOWFLAKE_ROLE') }}"
        database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
        schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
        warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
        threads: 4

      - type: lakecompute
        method: fivetran
        fivetran_credential: "{{ env_var('LAKE_COMPUTE_AUTH_TOKEN') }}"
        database: "{{ env_var('LAKE_COMPUTE_DATABASE') }}"
        schema: "{{ env_var('LAKE_COMPUTE_SCHEMA') }}"
