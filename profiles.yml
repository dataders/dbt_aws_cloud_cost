## Profile for the alt-compute-only demo: the whole DAG runs on the
## dbt-compute (Alt engine) target directly — no x_alt_target routing, no
## catalogs.yml involvement. Needs an fs-built dbt (the published CLI
## doesn't support `type: alt` yet) plus the adbc_driver_dbt built via
## quack/scripts/build-adbc-driver-local.sh. See .env.example.
aws_cloud_cost:
  target: dbt_compute
  outputs:
    dbt_compute:
      type: alt
      method: token
      base_url: "{{ env_var('DBT_COMPUTE_BASE_URL', 'https://api.dbt-compute.staging.fivetran.com/') }}"
      token: "{{ env_var('DBT_COMPUTE_AUTH_TOKEN', '') }}"
      organization: "{{ env_var('DBT_COMPUTE_ORG', 'fivetran') }}"
      database: "{{ env_var('DBT_COMPUTE_DATABASE', 'opening_pulling') }}"
      schema: "{{ env_var('DBT_COMPUTE_SCHEMA', 'anders') }}"
      threads: 4
