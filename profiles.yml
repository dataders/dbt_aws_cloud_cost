## Profile for the multi-catalog demo (DuckDB only).
##
## Secret blocks follow the same convention as catalogs.yml: the secrets for
## inactive catalogs are commented with `# ` and must be uncommented together
## with their catalog block. minio_secret stays active — it is static, makes
## no network call at creation, and is required by the lakekeeper target.
aws_cloud_cost:
  target: snowflake_demo
  x_alt_target: dbt_compute
  outputs:
    ## dbt-compute (Alt engine) — queries the opening_pulling MDLS destination
    ## via the staging dbt-compute service. Needs DBT_COMPUTE_AUTH_TOKEN (a
    ## minted JWT) + DBT_COMPUTE_ORG from the env; see polaris.envrc /
    ## dbt-aws-cloud-cost.envrc in the private overlay.
    dbt_compute:
      type: alt
      method: token
      base_url: "{{ env_var('DBT_COMPUTE_BASE_URL', 'https://api.dbt-compute.staging.fivetran.com/') }}"
      token: "{{ env_var('DBT_COMPUTE_AUTH_TOKEN', '') }}"
      organization: "{{ env_var('DBT_COMPUTE_ORG', 'fivetran') }}"
      database: "{{ env_var('DBT_COMPUTE_DATABASE', 'opening_pulling') }}"
      schema: "{{ env_var('DBT_COMPUTE_SCHEMA', 'anders') }}"
      threads: 4
    ## snowflake_demo — native Snowflake output against the catalog-linked
    ## database created from the Snowflake catalog integration pointed at the
    ## opening_pulling MDLS destination. Password auth; creds come from the
    ## "MDLS Compute (Snowflake)" 1Password item. See .env.example for the
    ## SNOWFLAKE_DEMO_* vars.
    snowflake_demo:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_DEMO_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_DEMO_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_DEMO_PRIVATE_KEY') }}"
      role: "{{ env_var('SNOWFLAKE_DEMO_ROLE', 'ACCOUNTADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DEMO_DATABASE', 'catalog_db_opening_pulling') }}"
      schema: "{{ env_var('SNOWFLAKE_DEMO_SCHEMA', 'anders') }}"
      warehouse: "{{ env_var('SNOWFLAKE_DEMO_WAREHOUSE', 'COMPUTE_WH') }}"
      threads: 4
