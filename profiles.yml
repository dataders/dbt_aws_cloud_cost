## Profile for the multi-catalog demo (DuckDB only).
##
## Secret blocks follow the same convention as catalogs.yml: the secrets for
## inactive catalogs are commented with `# ` and must be uncommented together
## with their catalog block. minio_secret stays active — it is static, makes
## no network call at creation, and is required by the lakekeeper target.
aws_cloud_cost:
  target: catalog_demo
  x_alt_target: dbt_compute
  outputs:
    ## dbt-compute (Alt engine) — queries the opening_pulling MDLS destination
    ## via the staging dbt-compute service. Needs DBT_COMPUTE_AUTH_TOKEN (a
    ## minted JWT) + DBT_COMPUTE_ORG from the env; see polaris.envrc /
    ## dbt-aws-cloud-cost.envrc in the private overlay.
    dbt_compute:
      type: alt
      method: token
      base_url: "{{ env_var('POLARIS_URL', 'https://1k56c2c4xlti6-acc.us-east-1.aws.polaris.fivetran.com/api/catalog') }}"
      token: "{{ env_var('DBT_COMPUTE_AUTH_TOKEN', '') }}"
      organization: "{{ env_var('DBT_COMPUTE_ORG', 'fivetran') }}"
      database: "{{ env_var('DBT_COMPUTE_DATABASE', 'opening_pulling') }}"
      schema: "{{ env_var('DBT_COMPUTE_SCHEMA', 'anders') }}"
      threads: 4
    catalog_demo:
      type: duckdb
      path: "data/aws_cloud_cost_demo.duckdb"
      schema: aws_cloud_cost
      threads: 4
      settings:
        ## The official DuckDB 1.5.4 driver (fetched from the dbt CDN) does NOT
        ## statically link httpfs/iceberg/ducklake, so DuckDB autoloads (and, on
        ## first use, autoinstalls) those signed extensions from the official
        ## extension repository. Leave autoinstall/autoload enabled.
        autoinstall_known_extensions: true
        autoload_known_extensions: true
    