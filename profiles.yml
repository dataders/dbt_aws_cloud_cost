## Profile for the multi-catalog demo (DuckDB only).

aws_cloud_cost:
  target: prod
  outputs:

    prod:
      - type: databricks
        default: true
        host: "{{ env_var('DATABRICKS_HOST') }}"
        http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
        token: "{{ env_var('DATABRICKS_TOKEN') }}"
        database: "{{ env_var('DATABRICKS_CATALOG') }}"
        schema: "{{ env_var('DATABRICKS_SCHEMA', 'aws_cloud_cost') }}"
        threads: 4

      - type: lakecompute
        ## The Snowflake demo used production Lake Compute by default. This
        ## PAT is a staging token: staging PATs must exchange at api-staging
        ## (production returns 401) and hit the staging dbt-compute API.
        method: fivetran
        base_url: "{{ env_var('LAKE_COMPUTE_BASE_URL', 'https://api.dbt-compute.staging.fivetran.com/') }}"
        fivetran_credential: "{{ env_var('LAKE_COMPUTE_AUTH_TOKEN') }}"
        fivetran_auth_url: "{{ env_var('LAKE_COMPUTE_AUTH_URL', 'https://api-staging.fivetran.com') }}"
        database: "{{ env_var('LAKE_COMPUTE_DATABASE') }}"
        schema: "{{ env_var('LAKE_COMPUTE_SCHEMA') }}"
